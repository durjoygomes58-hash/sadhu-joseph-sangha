<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 'Hind Siliguri',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.hd .t{flex:1;min-width:0;line-height:1.3}
.hd b{display:block;font-size:19px}.hd small{color:#f2d58a;font-size:13px}
.ib{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;padding:4px 8px}
.lg{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--hd);font-size:22px;flex:none}
.bar{background:var(--ac);color:#1c2433;padding:6px 16px;font-size:14px;font-weight:600}
.hero{background:linear-gradient(180deg,#0f2a4d,#1c5d8a);color:#fff;padding:28px 20px 32px;border-radius:0 0 36px 36px;position:relative}
.hero .lg{width:84px;height:84px;font-size:38px;float:left;margin-right:14px}
.hero h1{margin:6px 0 0;font-size:28px;line-height:1.3}
.hero .en{color:#f2d58a;font-size:17px;margin:0}
.pill{clear:both;display:block;background:rgba(255,255,255,.16);color:#ffd36b;font-weight:600;border-radius:16px;padding:10px 14px;margin:20px 0 14px;font-size:15px}
.slg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:30px;font-weight:700;line-height:1.3}
.hero p.d{margin:10px 0 18px;opacity:.9}
.bt{display:flex;gap:10px;flex-wrap:wrap}
.bt a,.bt button{font:inherit;font-weight:600;border-radius:30px;padding:10px 20px;cursor:pointer;text-decoration:none;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff}
.bt .y{background:var(--ac);color:#1c2433;border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h2{margin:8px 0 14px;font-size:26px;color:var(--pr)}
h3{margin:0 0 4px;font-size:18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cd{background:var(--cd);border-radius:22px;padding:18px;text-decoration:none;color:var(--tx);display:block;border:1px solid var(--bd)}
.cd:last-child{grid-column:1/-1}
.ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:14px}
.cd b{display:block;font-size:20px}.cd small{color:var(--mu);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.list{display:grid;gap:12px}
.item{position:relative;background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px}
.mem{text-align:center}
.av{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:var(--pr);color:var(--on);font-size:34px;font-weight:700}
.mu{color:var(--mu);font-size:14px;margin:0}
.bdy{white-space:pre-wrap;margin:0}
.ev img{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.gal{padding:0;overflow:hidden;cursor:zoom-in}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gal p{margin:0;padding:6px 10px;font-size:14px}
.tag{display:inline-block;background:var(--ac);color:#1c2433;border-radius:20px;padding:0 10px;font-size:13px;font-weight:600}
.empty{color:var(--mu)}
a{color:var(--pr)}
.btn{font:inherit;font-weight:600;border:0;border-radius:24px;background:var(--pr);color:var(--on);padding:9px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.add{margin-top:14px;display:block}
.hero .add{background:var(--ac);color:#1c2433;margin-top:16px}
.ctl{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2}
.ctl button{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:2px 7px;cursor:pointer}
.bn{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.bn a{flex:1;text-align:center;text-decoration:none;color:var(--mu);font-size:13px;line-height:1.3;padding:4px 0;border-radius:22px}
.bn a span{display:block;font-size:22px}
.bn a.on{background:rgba(242,184,64,.3);color:var(--tx);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:40}
.dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--cd);z-index:41;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow:auto}
.dr a{display:block;padding:12px 14px;border-radius:12px;text-decoration:none;color:var(--tx);font-weight:600}
.dr a.on{background:rgba(242,184,64,.3)}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.65);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
.box{background:var(--cd);color:var(--tx);border-radius:18px;padding:18px;width:100%;max-width:520px}
.box label{display:block;margin:10px 0 2px;font-size:14px;color:var(--mu)}
.box input:not([type=file]),.box textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.pv{width:90px;height:90px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.row{display:flex;gap:8px;margin-top:16px}
.pv[hidden]{display:none}
.cv{position:relative;overflow:hidden;margin:12px auto 0;touch-action:none;background:#000;cursor:grab}
.zoom{max-width:100%;max-height:85vh;border-radius:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:60;width:max-content;max-width:90%}
.band{background:var(--hd);color:#fff;padding:18px 16px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.band h2{color:#fff;margin:0;font-size:24px}.band small{color:#f2d58a;font-size:16px}
.adb{background:var(--ac);color:#1c2433;font-weight:700;border-radius:14px;padding:8px 12px;font-size:14px}
.sq{width:100%;font:inherit;padding:12px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
.sq::placeholder{color:#b9c6dc}

.rl{display:inline-block;background:rgba(80,110,170,.18);color:var(--pr);font-weight:700;border-radius:20px;padding:2px 14px;margin:6px 8px 4px 0}
.pf{font-size:14px}
.ph{display:inline-block;background:rgba(140,100,190,.18);border-radius:12px;padding:3px 12px;text-decoration:none;color:var(--tx);margin-top:4px}

if(cur=='members')return `<div class="band"><div><h2>সদস্য তালিকা (Members)</h2><small>মোট সদস্য: ${D.members.length} জন</small></div>${E()?'<span class="adb">অ্যাডমিন নিয়ন্ত্রণ সক্রিয়</span>':''}<input id="sq" class="sq" placeholder="🔍 নাম বা পদবী দিয়ে খুঁজুন…" value="${esc(mq)}"></div><main><div id="ml">${mlist()}</div></main>${E()?'<button class="fab" data-a="add" data-c="members">+</button>':''}`;
if(cur=='events')return w(list('events','list')+addB('events'));
if(cur=='notices')return w(list('notices','list')+addB('notices'));
if(cur=='gallery')return w(list('gallery','grid')+addB('gallery'));
if(cur=='history')return w(txt(c.history)+cfgB('history')+`<h3 style="margin-top:24px">প্রাক্তন সদস্যবৃন্দ</h3>`+list('alumni','grid')+addB('alumni'));
if(cur=='about')return aboutView();
return w(`<div class="item">${c.phone?`<p>📞 <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></p>`:''}${c.email?`<p>✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p>`:''}${c.addr?`<p class="bdy">📍 ${esc(c.addr)}</p>`:''}${(c.fb.startsWith('http://')||c.fb.startsWith('https://'))?`<p>🔗 <a href="${esc(c.fb)}" rel="noopener" target="_blank">ফেসবুক পেজ</a></p>`:''}${c.phone||c.email||c.addr||c.fb?'':'<p class="empty">যোগাযোগের তথ্য এখনো যোগ করা হয়নি।</p>'}</div>`+cfgB('contact'))}
function paint(){const c=D.cfg;
const nb=[['home','🏠','হোম'],['members','👥','সদস্য'],['notices','🔔','নোটিশ'],['events','📅','ইভেন্ট'],['gallery','🖼️','গ্যালারি']];
$('#app').innerHTML=`<header class="hd"><button class="ib" data-a="${cur=='home'?'menu':'back'}">${cur=='home'?'☰':'←'}</button>${lg()}<div class="t"><b>${esc(cur=='home'?c.hero:cur=='member'?'সদস্য প্রোফাইল':T[cur])}</b><small>${esc(cur=='home'?c.en:cur=='member'?'Member Profile':EN[cur])}</small></div><button class="ib" data-a="adm">🛡️</button></header>`+(ADM?`<div class="bar"><span>${SHOW?'অ্যাডমিন মোড':'প্রিভিউ মোড'}</span><span><button data-a="adm">${SHOW?'প্রিভিউ':'এডিট'}</button><button data-a="adms">অ্যাডমিন</button>${!D.members.length?'<button data-a="imp">পুরনো ডেটা আনুন</button>':''}<button data-a="out">লগআউট</button></span></div>`:'')+view()+
`<nav class="bn">${nb.map(([h,i,t])=>`<a href="#${h}" class="${cur==h||(cur=='member'&&h=='members')?'on':''}"><span>${i}</span>${t}</a>`).join('')}</nav>`+
(menu?`<div class="ov" data-a="menu"></div><div class="dr">${V.map(h=>`<a href="#${h}" class="${cur==h?'on':''}">${h=='home'?'🏠 হোম':T[h]}</a>`).join('')}</div>`:'')}
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';$('#ov').appendChild(e)}e.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>e.remove(),7000)}
const fail=e=>toast(e&&e.code=='permission-denied'?'আপনার সম্পাদনার অনুমতি নেই':'ব্যর্থ: '+((e&&e.code)||'ত্রুটি'));
const ok=()=>toast('সংরক্ষিত ✓');
async function put(c,o,id){try{if(id)await setDoc(doc(db,c,id),o,{merge:true});else await addDoc(collection(db,c),Object.assign({ts:Date.now()},o));ok()}catch(e){fail(e)}}
async function importOld(){try{for(const x of SEED)await addDoc(collection(db,'members'),Object.assign({ts:Date.now()},x));ok()}catch(e){fail(e)}}
async function pushNotice(o){
if(!confirm('এই নোটিশ সবার ফোনে নোটিফিকেশন হিসেবে পাঠাবেন?'))return;
try{const k=(await getDoc(doc(db,'admins','config'))).data(),key=k&&k.osKey;
if(!key){toast('আগে অ্যাডমিন বক্সে OneSignal REST API Key বসান');return}
const r=await fetch('https://api.onesignal.com/notifications?c=push',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Key '+key},body:JSON.stringify({app_id:OSID,target_channel:'push',included_segments:['Total Subscriptions'],headings:{en:o.title||'নতুন নোটিশ'},contents:{en:(o.text||o.title||'').slice(0,200)},url:location.href.split('#')[0]+'#notices'})});
const j=await r.json();
toast(r.ok&&j.id?'নোটিফিকেশন পাঠানো হয়েছে ✓':'পাঠানো যায়নি: '+(j.errors?JSON.stringify(j.errors).slice(0,90):r.status))}
catch(e){toast('পাঠানো যায়নি। OneSignal ড্যাশবোর্ড থেকে পাঠান।')}}
async function osSend(body){try{const k=(await getDoc(doc(db,'admins','config'))).data(),key=k&&k.osKey;
if(!key)return 'আগে অ্যাডমিন বক্সে OneSignal REST API Key বসান';
const r=await fetch('https://api.onesignal.com/notifications?c=push',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Key '+key},body:JSON.stringify(Object.assign({app_id:OSID,target_channel:'push'},body))});
const j=await r.json();return r.ok&&j.id?true:(j.errors?JSON.stringify(j.errors).slice(0,90):String(r.status))}catch(e){return 'ব্রাউজারে বাধা, OneSignal ড্যাশবোর্ড থেকে পাঠান'}}
async function pushBirthday(id){const x=D.members.find(m=>m.id==id);if(!x)return;
const msg=prompt(x.name+'-কে যে জন্মদিনের শুভেচ্ছা পাঠাতে চান তা লিখুন:','সাধু যোসেফ যুব সংঘের পক্ষ থেকে '+x.name+'-কে জন্মদিনের অনেক শুভেচ্ছা ও ভালোবাসা। ঈশ্বর তোমাকে আশীর্বাদ করুন। 🙏');
if(msg===null||!msg.trim())return;
const r=await osSend({included_segments:['Total Subscriptions'],headings:{en:'🎂 শুভ জন্মদিন, '+x.name+'!'},contents:{en:msg.trim().slice(0,200)},url:location.href.split('#')[0]});
toast(r===true?'শুভেচ্ছা নোটিফিকেশন পাঠানো হয়েছে ✓':'পাঠানো যায়নি: '+r)}
function login(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h3>অ্যাডমিন লগইন</h3><label>ইমেইল</label><input data-e type="email" autocomplete="username"><label>পাসওয়ার্ড</label><input data-p type="password" autocomplete="current-password"><div class="row"><button class="btn" data-s>লগইন</button><button class="btn ghost" data-x>বাতিল</button></div></div>`;
m.onclick=async e=>{if(e.target==m||e.target.dataset.x!=null)m.remove();if(e.target.dataset.s!=null){try{await signInWithEmailAndPassword(au,m.querySelector('[data-e]').value.trim(),m.querySelector('[data-p]').value);m.remove();toast('লগইন সফল')}catch(x){toast('ইমেইল বা পাসওয়ার্ড ভুল')}}};$('#ov').appendChild(m)}
function adminBox(){const m=document.createElement('div');m.className='modal';
const draw=()=>{m.innerHTML=`<div class="box"><h3>অ্যাডমিন ব্যবস্থাপনা</h3><p class="mu">${esc(OWNER)} (প্রধান)</p>${admins.map(x=>`<p>${esc(x)} <button class="btn ghost" data-r="${esc(x)}">সরান</button></p>`).join('')}<label>নতুন অ্যাডমিনের ইমেইল</label><input data-n type="email"><p class="mu">আগে Firebase → Authentication → Users-এ তাঁর অ্যাকাউন্ট খুলুন।</p><label>OneSignal REST API Key (নোটিফিকেশনের জন্য)</label><input data-key type="password" autocomplete="off"><p><button class="btn ghost" data-sk>কী সংরক্ষণ করুন</button></p><div class="row"><button class="btn" data-ad>যোগ করুন</button><button class="btn ghost" data-x>বন্ধ</button></div></div>`};
draw();
m.onclick=async e=>{const d=e.target.dataset;if(e.target==m||d.x!=null)m.remove();else if(d.ad!=null){const v=m.querySelector('[data-n]').value.trim().toLowerCase();if(v.includes('@')){try{await setDoc(doc(db,'admins',v),{ts:Date.now()});setTimeout(draw,500)}catch(x){fail(x)}}}else if(d.sk!=null){const v=m.querySelector('[data-key]').value.trim();if(v){try{await setDoc(doc(db,'admins','config'),{osKey:v},{merge:true});toast('কী সংরক্ষিত ✓');m.querySelector('[data-key]').value=''}catch(x){fail(x)}}}else if(d.r){try{await deleteDoc(doc(db,'admins',d.r));setTimeout(draw,500)}catch(x){fail(x)}}};
$('#ov').appendChild(m)}
const crop=(src,asp,mx)=>new Promise(ok=>{const i=new Image();i.onerror=()=>ok(null);i.onload=()=>{
const W=Math.min(320,innerWidth-64),H=Math.round(W/asp),base=Math.max(W/i.width,H/i.height);let z=1,x=(W-i.width*base)/2,y=(H-i.height*base)/2;
const m=document.createElement('div');m.className='modal';m.style.zIndex=70;
m.innerHTML=`<div class="box" style="text-align:center"><h3>ছবি কেটে ঠিক করুন</h3><p class="mu">আঙুল দিয়ে সরান, স্লাইডার দিয়ে জুম করুন</p><div class="cv" style="width:${W}px;height:${H}px;border-radius:${asp==1?'50%':'12px'}"><img alt="" draggable="false"></div><input type="range" min="1" max="4" step="0.01" value="1" style="width:100%;margin-top:12px"><div class="row"><button class="btn" data-o>ঠিক আছে</button><button class="btn ghost" data-c>বাতিল</button></div></div>`;
const im=m.querySelector('img'),cv=m.querySelector('.cv'),r=m.querySelector('input');
const put=()=>{const s=base*z;x=Math.min(0,Math.max(W-i.width*s,x));y=Math.min(0,Math.max(H-i.height*s,y));im.style.cssText='position:absolute;left:0;top:0;max-width:none;width:'+(i.width*s)+'px;height:'+(i.height*s)+'px;transform:translate('+x+'px,'+y+'px)'};
im.src=src;put();let d=null;
cv.onpointerdown=e=>{d={px:e.clientX,py:e.clientY,x:x,y:y};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!d)return;x=d.x+e.clientX-d.px;y=d.y+e.clientY-d.py;put()};
cv.onpointerup=()=>{d=null};
r.oninput=()=>{const o=base*z,cx=(W/2-x)/o,cy=(H/2-y)/o;z=+r.value;const s=base*z;x=W/2-cx*s;y=H/2-cy*s;put()};
m.onclick=e=>{if(e.target.dataset.c!=null){m.remove();ok(null)}if(e.target.dataset.o!=null){const s=base*z,c=document.createElement('canvas');c.width=mx;c.height=Math.round(mx/asp);c.getContext('2d').drawImage(i,-x/s,-y/s,W/s,H/s,0,0,c.width,c.height);m.remove();ok(c.toDataURL('image/jpeg',.82))}};
$('#ov').appendChild(m)};i.src=src});
const shrink=(f,m)=>new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=()=>no();fr.onload=()=>{const i=new Image();i.onerror=()=>no();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};i.src=fr.result};fr.readAsDataURL(f)});
function form(title,fields,v,max,done){
imgs={};const m=document.createElement('div');m.className='modal';
m.innerHTML=`<div class="box"><h3>${esc(title)}</h3>`+fields.map(([k,l,t,o])=>{imgs[k]=v[k]||'';return `<label>${l}</label>`+(t=='area'?`<textarea data-k="${k}" rows="6">${esc(v[k])}</textarea>`:t=='bd'?`<div class="row" style="margin-top:0"><select data-bd="d"><option value="">দিন</option>${Array.from({length:31},(_,i)=>{const d=String(i+1).padStart(2,'0');return `<option value="${d}" ${String(v[k]||'').slice(8,10)==d?'selected':''}>${(i+1).toLocaleString('bn-BD')}</option>`}).join('')}</select><select data-bd="m"><option value="">মাস</option>${MONTHS.map((n,i)=>{const mm=String(i+1).padStart(2,'0');return `<option value="${mm}" ${String(v[k]||'').slice(5,7)==mm?'selected':''}>${n}</option>`}).join('')}</select></div>`:t=='sel'?`<select data-k="${k}">${opts(o,v[k]).map(g=>`<option ${g==v[k]?'selected':''}>${g}</option>`).join('')}</select>`:t=='img'?`<img class="pv" ${v[k]?`src="${v[k]}"`:'hidden'} alt=""><input type="file" accept="image/*" data-f="${k}">`:`<input data-k="${k}" type="${t=='date'?'date':'text'}" value="${esc(v[k])}">`)}).join('')+`<div class="row"><button class="btn" data-s>সংরক্ষণ করুন</button><button class="btn ghost" data-x>বাতিল</button></div></div>`;
const pick=async e=>{const k=e.target.dataset.f;if(!k||!e.target.files||!e.target.files[0])return;const f=e.target.files[0];if(e.target._f===f)return;e.target._f=f;toast('ছবি প্রক্রিয়া হচ্ছে…');try{imgs[k]=await crop(await shrink(f,1600),fields.some(q=>q[0]=='place')?4/3:1,max||400);if(!imgs[k]){imgs[k]=v[k]||'';e.target.value='';e.target._f=null;toast('ছবি বাতিল হয়েছে');return}}catch(x){toast('ছবি পড়া যায়নি, অন্য ছবি দিন');return}const p=e.target.previousElementSibling;p.src=imgs[k];p.hidden=false;toast('ছবি যুক্ত হয়েছে ✓ এবার সংরক্ষণ করুন')};m.addEventListener('change',pick);m.addEventListener('input',pick);
m.addEventListener('click',e=>{if(e.target==m||e.target.dataset.x!=null)m.remove();if(e.target.dataset.s!=null){const o={};fields.forEach(([k,l,t])=>{o[k]=t=='img'?imgs[k]:t=='bd'?bdv(m):m.querySelector(`[data-k="${k}"]`).value.trim()});m.remove();done(o)}});
$('#ov').appendChild(m)}
document.addEventListener('click',async e=>{
if(e.target.closest('a[href^="tel"],a[href^="https://wa.me"]'))return;const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,c=b.dataset.c,i=+b.dataset.i;
if(a=='menu'){menu=!menu;paint()}
else if(a=='back'){location.hash=cur=='member'?'#members':'#home'}
else if(a=='open'){location.hash='#member-'+b.dataset.id}
else if(a=='adm'){if(!ADM)login();else{SHOW=!SHOW;paint()}}
else if(a=='me'){OneSignalDeferred.push(async function(OS){try{await OS.login(b.dataset.id);toast('ধন্যবাদ! জন্মদিনে আপনি ব্যক্তিগত শুভেচ্ছা পাবেন')}catch(e){toast('এখন সম্ভব হয়নি, নোটিফিকেশন চালু আছে কি দেখুন')}})}
else if(a=='out'){await signOut(au);toast('লগআউট হয়েছে')}
else if(a=='zoom'){const m=document.createElement('div');m.className='modal';m.innerHTML=`<img class="zoom" src="${D.gallery[i].photo}" alt="">`;m.onclick=()=>m.remove();$('#ov').appendChild(m)}
else if(!ADM)return;
else if(a=='add')form(S[c].t+' যোগ করুন',S[c].f,{},S[c].m,async o=>{await put(c,o);if(c=='notices')pushNotice(o)});
else if(a=='edit')form(S[c].t+' এডিট',S[c].f,D[c][i],S[c].m,o=>put(c,o,D[c][i].id));
else if(a=='del'){if(confirm('মুছে ফেলতে চান?')){try{await deleteDoc(doc(db,c,D[c][i].id));if(cur=='member')location.hash='#members';ok()}catch(x){fail(x)}}}
else if(a=='cfg'){const g=b.dataset.g;form('তথ্য এডিট',L[g].map(k=>[k,CL[k],CT[k]||'text']),D.cfg,300,o=>put('site',o,'cfg'))}
else if(a=='adms')adminBox();
else if(a=='imp')importOld();
else if(a=='pbd')pushBirthday(b.dataset.id);
});
document.addEventListener('input',e=>{if(e.target.id=='sq'){mq=e.target.value;$('#ml').innerHTML=mlist()}});
const route=()=>{const h=location.hash.slice(1);if(h.startsWith('member-')){cur='member';mid=h.slice(7)}else cur=V.includes(h)?h:'home';menu=false;paint();scrollTo(0,0)};
addEventListener('hashchange',route);
route();
['members','events','notices','gallery','alumni'].forEach(c=>onSnapshot(collection(db,c),s=>{const up=c=='members'||c=='alumni';D[c]=s.docs.map(x=>Object.assign({},x.data(),{id:x.id})).sort((a,b)=>c=='members'?rank(a.role)-rank(b.role)||(a.ts||0)-(b.ts||0):up?(a.ts||0)-(b.ts||0):(b.ts||0)-(a.ts||0));paint()},er=>toast('তথ্য আনা যায়নি: '+er.code)));
onSnapshot(doc(db,'site','cfg'),s=>{D.cfg=Object.assign({},def.cfg,s.exists()?s.data():{});paint()},()=>{});
let unA=null;
onAuthStateChanged(au,async u=>{user=u;ADM=false;if(unA){unA();unA=null}
if(u){const em=(u.email||'').toLowerCase();let okA=em==OWNER;if(!okA){try{await getDoc(doc(db,'admins',em));okA=true}catch(e){okA=false}}
if(okA){ADM=true;unA=onSnapshot(collection(db,'admins'),s=>{admins=s.docs.map(x=>x.id).filter(x=>x.includes('@'))},()=>{})}else{toast('এই অ্যাকাউন্টটি অ্যাডমিন নয়');await signOut(au);return}}
paint()});
</script></body></html>
